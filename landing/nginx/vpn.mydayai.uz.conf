# Rise VPN landing — nginx server block.
#
# Deploy: copy to /etc/nginx/sites-available/vpn-landing, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Listens on 9443 because the xray VLESS+REALITY tunnel container already
# binds 0.0.0.0:443 for the VPN itself. Sharing 9443 with vpnapi and
# vpnadmin works via SNI: nginx routes by server_name on the same TLS
# listener.
#
# The Let's Encrypt cert is provisioned with:
#   certbot certonly --nginx -d vpn.mydayai.uz
# and renews via the certbot.timer systemd unit already installed on the box.

# HTTP → HTTPS redirect. Port 80 has nothing useful to serve here.
server {
    listen 80;
    server_name vpn.mydayai.uz;
    # Hard-code 9443 because $host alone has no port and we want the
    # browser to land directly on the right listener.
    return 301 https://vpn.mydayai.uz:9443$request_uri;
}

server {
    listen 9443 ssl http2;
    server_name vpn.mydayai.uz;

    ssl_certificate /etc/letsencrypt/live/vpn.mydayai.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.mydayai.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/vpn/landing/dist;
    index index.html;

    # Phase 4 D-02 — landing-node upstream. The container is brought up by
    # landing/docker-compose.landing.yml and joins the shared vpn-net
    # bridge alongside vpn-api. nginx reaches it by container name.
    upstream landing_node {
        server landing-node:3000;
        keepalive 16;
    }

    # Bare "/" → "/ru/". The static export ships an index.html with a
    # <meta refresh> as a fallback, but a 302 is faster and search
    # engines understand it as the canonical default-locale redirect.
    # Returns 302 (not 301) so we can change the default locale later
    # without browsers cementing the redirect in their cache.
    location = / {
        return 302 /ru/;
    }

    # ----- Phase 4 app surfaces — proxied to landing-node ------------------
    # Locale-prefixed app pages (login/dashboard/pricing/pay/{success,fail}).
    # The regex tolerates with/without trailing slash and the optional
    # /(ru|en|es)/ locale prefix that next-intl emits.
    location ~ ^/(?:(?:ru|en|es)/)?(?:login|dashboard|pricing|pay/(?:success|fail))/?$ {
        proxy_pass http://landing_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # OAuth callback (locale-less per Plan 04-04 D-10). form_post POST from
    # Apple / Google authorize endpoints lands here; longer body buffer than
    # the JSON proxy because id_tokens can exceed a few KB.
    location ^~ /auth/callback {
        proxy_pass http://landing_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # Node proxy catch-all + revalidate hook + logout endpoint.
    # `client_max_body_size 64k` matches backend PERF-09 + Plan 03's
    # BODY_BYTES_LIMIT (Plan 04-08 T-04-08-04 mitigation).
    location ^~ /api/ {
        proxy_pass http://landing_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }
    # ----------------------------------------------------------------------

    # Hashed asset chunks (JS / CSS) emitted by Next.js are immutable —
    # the filename includes a content hash, so a deploy always emits new
    # filenames and never reuses a cached old one. One year cache.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Other static assets (favicon, og-image, icon.svg, manifest icons).
    # Shorter cache than _next/static because filenames are stable across
    # deploys, so we want refresh on rotation.
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # Next.js metadata image routes are emitted as extension-less files
    # (out/icon, out/apple-icon, out/ru/opengraph-image). Force PNG MIME
    # so browsers and crawlers render them correctly.
    location = /icon {
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public" always;
    }
    location = /apple-icon {
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public" always;
    }
    # nginx parses curly braces in unquoted regex as directive context.
    # Spelling out the two locale chars avoids the {2} quantifier.
    location ~ ^/[a-z][a-z]/opengraph-image$ {
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # robots.txt, sitemap.xml, manifest.webmanifest — short cache so SEO
    # tools see updates quickly when we change them.
    location ~ ^/(robots\.txt|sitemap\.xml|manifest\.webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    # SPA-ish fallback for the locale routes. Next.js with output: 'export'
    # and trailingSlash: true emits one folder per page (e.g. /ru/index.html,
    # /ru/privacy/index.html). nginx tries the literal URI, then with a
    # trailing slash, then the .html flattening, before falling back to 404.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;

        # HTML must not be cached aggressively — index.html references
        # hashed asset filenames, so a stale HTML in a CDN/browser cache
        # would pin users to dead chunks after a deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        # Defensive security headers. CSP pins script-src to self (no third
        # parties run JS in our document — no analytics, no embeds). The
        # one exception we may add later is Yandex Metrika; if/when that
        # happens, allow https://mc.yandex.ru in script-src + connect-src.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Block hidden dotfiles in case dist/ ever accidentally contains one.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 404 page — the static export already produces /404.html with brand
    # styling, so just point there.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
