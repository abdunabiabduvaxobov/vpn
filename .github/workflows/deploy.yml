name: Build & Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.prod.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Build both API and Tunnel images'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/abdunabiabduvaxobov/vpn

jobs:
  # Detect which services changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api || github.event.inputs.force_all == 'true' }}
      tunnel: ${{ steps.filter.outputs.tunnel || github.event.inputs.force_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'server/api/**'
            tunnel:
              - 'server/tunnel/**'

  # Build and push API image
  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server/api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest

  # Build and push Tunnel image
  build-tunnel:
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server/tunnel
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-tunnel:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-tunnel:latest

  # Deploy to production server
  deploy:
    needs: [changes, build-api, build-tunnel]
    if: |
      always() &&
      needs.build-api.result != 'failure' &&
      needs.build-tunnel.result != 'failure' &&
      (needs.build-api.result == 'success' || needs.build-tunnel.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Pre-flight — prod host reachable on :22
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error title=SERVER_HOST is empty::Set it with: gh secret set SERVER_HOST"
            exit 1
          fi
          echo "Probing prod host on :22 (5s timeout)…"
          if nc -z -w 5 "$HOST" 22; then
            echo "✓ prod host reachable — proceeding to deploy"
          else
            echo "::error title=Prod host unreachable::No SSH response on :22 within 5s. Is the VPS up (paid/running)? Is the SERVER_HOST secret current? Is port 22 open to GitHub Actions runner IPs? (last good deploy: 2026-04-26)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # PERF-03 / D-01: the data tier is now its own compose file
          # (docker-compose.data.yml) and Postgres mounts a tuned
          # postgresql.conf — both must reach the host. postgresql.conf lives
          # under server/api/ and survives the `rm -rf server/` step below
          # because it is copied to its final path before that step runs.
          source: "docker-compose.prod.yml,docker-compose.data.yml,server/api/migrations,server/api/postgresql.conf"
          target: "/opt/vpn"
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/vpn

            # Move migrations to expected location (./migrations, mounted by the
            # data tier into docker-entrypoint-initdb.d). Keep server/api/
            # because docker-compose.data.yml mounts server/api/postgresql.conf
            # directly — so DO NOT rm -rf server/ anymore (PERF-03 / D-01).
            if [ -d "server/api/migrations" ]; then
              mkdir -p migrations
              cp -r server/api/migrations/* migrations/ 2>/dev/null || true
            fi

            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u abdunabiabduvaxobov --password-stdin

            # Pull and restart — bring up BOTH tiers together for the co-located
            # single-host deploy (PERF-03 / D-01). The data tier (postgres +
            # redis) and the app tier (api + tunnel) share the vpn-net network.
            docker compose -f docker-compose.data.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.data.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Cleanup
            docker image prune -f

            echo "Deploy complete: $(date)"
