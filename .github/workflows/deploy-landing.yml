name: Build & Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

# Decoupled from deploy.yml (backend) and deploy-admin.yml (admin panel).
# All three share only the production host and the /opt/vpn path prefix.
#
# The landing app is a Next.js `output: "standalone"` Node server — it needs a
# runtime for the /api/* proxy, HttpOnly-cookie auth, and force-dynamic pages,
# so it CANNOT be a static `out/` export. It is shipped as a Docker image
# (mirroring the api/tunnel pattern in deploy.yml) and run as the `landing-node`
# container on the shared vpn-net created by the backend prod stack.

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/abdunabiabduvaxobov/vpn

jobs:
  # Build and push the landing standalone image
  build-landing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: landing/Dockerfile bakes placeholder ARG defaults so
      # env.ts's fail-fast validation passes at build time. The REAL values are
      # injected at container start by docker-compose.landing.yml's ${VAR:?}
      # substitutions from /opt/vpn/.env.
      - uses: docker/build-push-action@v6
        with:
          context: landing
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-landing:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-landing:latest

  # Deploy the landing container to the production host
  deploy:
    needs: build-landing
    if: needs.build-landing.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Pre-flight — prod host reachable on :22
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error title=SERVER_HOST is empty::Set it with: gh secret set SERVER_HOST"
            exit 1
          fi
          echo "Probing prod host on :22 (5s timeout)…"
          if nc -z -w 5 "$HOST" 22; then
            echo "✓ prod host reachable — proceeding to deploy"
          else
            echo "::error title=Prod host unreachable::No SSH response on :22 within 5s. Is the VPS up (paid/running)? Is the SERVER_HOST secret current? Is port 22 open to GitHub Actions runner IPs? (last good deploy: 2026-04-26)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Copy landing compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "landing/docker-compose.landing.yml"
          target: "/opt/vpn"
          strip_components: 0

      - name: Deploy landing container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/vpn

            # landing-node joins vpn-net (external), created by the backend
            # prod stack — ensure the backend deploy has run at least once so
            # the network exists.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u abdunabiabduvaxobov --password-stdin

            # Requires /opt/vpn/.env to define the landing runtime vars
            # (compose ${VAR:?} fails fast otherwise):
            #   BACKEND_API_URL, REVALIDATE_SECRET, APPLE_SERVICE_ID,
            #   APPLE_REDIRECT_URI, GOOGLE_CLIENT_ID_WEB, GOOGLE_REDIRECT_URI, APP_URL
            docker compose -f landing/docker-compose.landing.yml pull landing-node
            docker compose -f landing/docker-compose.landing.yml up -d landing-node

            docker image prune -f
            echo "Landing deploy complete: $(date)"
