# Postgres tuning — PERF-09 / D-09c.
#
# pgtune-derived for a ~4GB-RAM data-tier host on SSD storage. These values
# SCALE WITH HOST RAM: if the data host has more/less memory, recompute via
# pgtune (https://pgtune.leopard.in.ua/) — shared_buffers ~= 25% of RAM,
# effective_cache_size ~= 50% of RAM. Mounted read-only into the postgres
# service in docker-compose.data.yml and selected via
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# max_connections=200 leaves headroom above the app pool's SetMaxOpenConns(100)
# for the background scheduler, manual psql sessions, and future API replicas.

shared_buffers = 1GB            # 25% of 4GB
effective_cache_size = 2GB      # 50% of 4GB
max_connections = 200
work_mem = 16MB
maintenance_work_mem = 256MB
random_page_cost = 1.1          # SSD

# Listen on all interfaces so the app tier can reach Postgres across the
# compose network (and, after the second-host move, across the private
# interface). Network exposure is constrained by NOT publishing a public host
# port in compose (D-02) and by host-level firewalling on the data host.
listen_addresses = '*'
