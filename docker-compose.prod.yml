# Production deployment — APP TIER (api + tunnel).
# Uses pre-built images from GitHub Container Registry.
# Server: 194.87.31.44 (/opt/vpn)
#
# The DATA TIER (postgres + redis) now lives in docker-compose.data.yml
# (PERF-03 / D-01). This file no longer declares postgres/redis services.
#
# --- Bring-up (PERF-03 / D-01) ---
# Co-located dev / single-host (DEFAULT — zero .env change):
#   docker compose -f docker-compose.data.yml -f docker-compose.prod.yml up -d
#   (the api reaches postgres/redis by service name over the shared vpn-net;
#    DB_HOST/REDIS_HOST default to "postgres"/"redis" below.)
#
# Second-host move (operator's call — no image change, D-01):
#   1. Run docker-compose.data.yml on the data host (see its runbook).
#   2. Set DB_HOST / REDIS_HOST in /opt/vpn/.env to the data host's private
#      address on THIS (app) host.
#   3. Run THIS file on the app host:
#        docker compose -f docker-compose.prod.yml up -d
#
# First-time setup:
#   1. Copy .env.prod to /opt/vpn/.env
#   2. Copy tunnel config to /opt/vpn/tunnel-config.json
#   3. Bring up both tiers (see Bring-up above).

services:
  api:
    image: ghcr.io/abdunabia/vpn-api:latest
    container_name: vpn-api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      # Host-parameterized (PERF-03 / D-01): DB_HOST / REDIS_HOST default to the
      # data-tier service names for co-located dev. Moving PG/Redis to a second
      # host is a zero-code .env change — set DB_HOST / REDIS_HOST and (when TLS
      # is enabled across the private link) flip sslmode=disable → sslmode=require
      # / redis:// → rediss://.
      DATABASE_URL: postgres://${POSTGRES_USER:-vpnapp}:${POSTGRES_PASSWORD}@${DB_HOST:-postgres}:5432/${POSTGRES_DB:-vpnapp}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@${REDIS_HOST:-redis}:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM:-}
      STRIPE_PRICE_ULTIMATE: ${STRIPE_PRICE_ULTIMATE:-}
      TUNNEL_VLESS_UUID: ${TUNNEL_VLESS_UUID:?Set TUNNEL_VLESS_UUID in .env}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-2.0.0}
      # Telegram recovery bot (ADR-006). All three are optional — the
      # bot goroutine only starts when TELEGRAM_RECOVERY_BOT_TOKEN is
      # non-empty, so deployments that don't need recovery run fine.
      TELEGRAM_RECOVERY_BOT_TOKEN: ${TELEGRAM_RECOVERY_BOT_TOKEN:-}
      TELEGRAM_RECOVERY_BOT_USERNAME: ${TELEGRAM_RECOVERY_BOT_USERNAME:-risevp_bot}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-0}
    # No depends_on for postgres/redis: the data tier is a separate compose
    # file (docker-compose.data.yml) and may run on a separate host (D-01).
    # The app retries its DB/Redis connection at startup. For the co-located
    # single-host bring-up, start the data tier first (or bring both files up
    # together) so the data services are healthy when the api dials them.
    # Networks: stay on the default bridge AND join vpn-net so postgres + redis
    # (data tier, also on vpn-net) remain reachable by service name, AND so the
    # landing-node overlay can dial http://vpn-api:3000 via shared DNS (B3 fix —
    # Phase 4 Plan 04-08). Compose semantics: declaring `networks:` on a service
    # detaches it from the default bridge unless `default` is listed explicitly.
    # Always list both.
    networks:
      - default
      - vpn-net
    restart: unless-stopped

  tunnel:
    image: ghcr.io/abdunabia/vpn-tunnel:latest
    container_name: vpn-tunnel
    ports:
      - "443:443"
      # AWG runs on host (not in Docker) for kernel/userspace access
      # - "51820:51820/udp"
    volumes:
      - ./tunnel-config.json:/app/config.json:ro
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

networks:
  # Phase 4 Plan 04-08 (B3) — shared bridge that lets the landing-node
  # container (declared in landing/docker-compose.landing.yml) AND the data
  # tier (docker-compose.data.yml) resolve vpn-api / postgres / redis via
  # service-name DNS. The api service joins this network + the default bridge.
  # Declared external so the same named network is shared whether this file is
  # brought up alone or merged with docker-compose.data.yml.
  vpn-net:
    name: vpn-net
    driver: bridge
